<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>R6S MAPS</title>
  <link rel="stylesheet" type="text/css" href="main.css">
</head>

<body>
  <div id="head_container">
    <button id="home_button" onclick="window.location.href='index.html'">R6S MAPS</button>
  </div>
  <div id="map_list">
    <button class="map_button" id="lair" onclick="window.location.href='lair/lair.html'">
      <img alt="Lair" class="map_thumbnail" src="lair/lair_thumbnail.png"><br>
      <span class="map_name">소굴</span>
    </button>
    <button class="map_button" id="nighthaven_labs" onclick="window.location.href='nighthaven_labs/nighthaven_labs.html'">
      <img alt="Nighthaven Labs" class="map_thumbnail" src="nighthaven_labs/nighthaven_labs_thumbnail.jpg"><br>
      <span class="map_name">나이트헤이븐 연구실</span>
    </button>
    <button class="map_button" id="emerald_plains">
      <img alt="Emerald Plains" class="map_thumbnail" onclick="window.location.href='emerald_plains/emerald_plains.html'" src="emerald_plains/emerald_plains_thumbnail.png"><br>
      <span class="map_name">에메랄드 평원</span>
    </button>
    <button class="map_button" id="villa">
      <img alt="Villa" class="map_thumbnail" onclick="window.location.href='villa/villa.html'" src="villa/villa_thumbnail.png"><br>
      <span class="map_name">빌라</span>
    </button>
    <button class="map_button" id="coastline">
      <img alt="Coastline" class="map_thumbnail" onclick="window.location.href='coastline/coastline.html'" src="coastline/coastline_thumbnail.png"><br>
      <span class="map_name">해안선</span>
    </button>
    <button class="map_button" id="border">
      <img alt="Border" class="map_thumbnail" onclick="window.location.href='border/border.html'" src="border/border_thumbnail.jpg"><br>
      <span class="map_name">국경</span>
    </button>
    <button class="map_button" id="kafe_dostoyevsky">
      <img alt="Kafe Dostoyevsky" class="map_thumbnail" onclick="window.location.href='kafe_dostoyevsky/kafe_dostoyevsky.html'" src="kafe_dostoyevsky/kafe_dostoyevsky_thumbnail.png"><br>
      <span class="map_name">도스토예프스키 카페</span>
    </button>
    <button class="map_button" id="chalet">
      <img alt="Chalet" class="map_thumbnail" onclick="window.location.href='chalet/chalet.html'" src="chalet/chalet_thumbnail.png"><br>
      <span class="map_name">별장</span>
    </button>
    <button class="map_button" id="bank">
      <img alt="Bank" class="map_thumbnail" onclick="window.location.href='bank/bank.html'" src="bank/bank_thumbnail.png"><br>
      <span class="map_name">은행</span>
    </button>
    <button class="map_button" id="consulate">
      <img alt="Consulate" class="map_thumbnail" onclick="window.location.href='consulate/tactics.html'" src="consulate/consulate_thumbnail.png"><br>
      <span class="map_name">영사관</span>
    </button>
    <button class="map_button" id="clubhouse">
      <img alt="Clubhouse" class="map_thumbnail" onclick="window.location.href='clubhouse/tactics.html'" src="clubhouse/clubhouse_thumbnail.jpg"><br>
      <span class="map_name">클럽하우스</span>
    </button>
    <button class="map_button" id="oregon">
      <img alt="Oregon" class="map_thumbnail" onclick="window.location.href='oregon/oregon.html'" src="oregon/oregon_thumbnail.png"><br>
      <span class="map_name">오리건</span>
    </button>
    <button class="map_button" id="fortress">
      <img alt="Fortress" class="map_thumbnail" src="fortress/fortress_thumbnail.png"><br>
      <span class="map_name">요새</span>
    </button>
  </div>
</body>
</html>
